<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!--
    Lightweight Google-Maps-style pin (approximation) for in-app button icon.
    Pure SVG (no external refs) so it renders consistently via flutter_svg.
  -->
  <defs>
    <clipPath id="pinClip">
      <path d="M128 18c-44.2 0-80 35.8-80 80 0 62.2 73.6 145.8 77 149.6 1.6 1.8 3.9 2.8 6.3 2.8s4.7-1 6.3-2.8c3.4-3.8 77-87.4 77-149.6 0-44.2-35.8-80-80-80z"/>
    </clipPath>
  </defs>

  <!-- Base pin -->
  <path d="M128 18c-44.2 0-80 35.8-80 80 0 62.2 73.6 145.8 77 149.6 1.6 1.8 3.9 2.8 6.3 2.8s4.7-1 6.3-2.8c3.4-3.8 77-87.4 77-149.6 0-44.2-35.8-80-80-80z" fill="#34A853"/>

  <!-- Multicolor "map" segments clipped into pin -->
  <g clip-path="url(#pinClip)">
    <!-- Blue segment -->
    <path d="M28 92c10-42 44-72 100-72 12 0 23 1.5 33 4.5L115 132 28 92z" fill="#4285F4"/>
    <!-- Red segment -->
    <path d="M206 38c22 15 38 42 38 74 0 8-1 16-3 24l-76-6 41-92z" fill="#EA4335"/>
    <!-- Yellow segment -->
    <path d="M14 132c2 20 10 39 23 56l78-56-101 0z" fill="#FBBC05"/>
    <!-- Inner white circle -->
    <circle cx="128" cy="104" r="46" fill="#FFFFFF"/>
    <!-- Inner blue wedge -->
    <path d="M128 58c25.4 0 46 20.6 46 46 0 5.4-.9 10.6-2.6 15.4L128 104V58z" fill="#4285F4"/>
    <!-- Inner green wedge -->
    <path d="M125 150c-13.2-.8-25.4-7.2-33.6-17.2L128 104l44 18c-8.5 16.5-25.8 28-47 28z" fill="#34A853"/>
    <!-- Inner red wedge -->
    <path d="M170 122l-42-18 43-42c10.2 8.4 17 21.1 17 35.5 0 9.1-2.7 17.6-7.9 24.5z" fill="#EA4335"/>
    <!-- Inner yellow wedge -->
    <path d="M85 66l43 38-37 30c-5.7-7.8-9.1-17.5-9.1-28 0-16.2 8.1-30.5 20.1-40z" fill="#FBBC05"/>
  </g>
</svg>
